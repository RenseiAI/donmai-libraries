packages:
  - 'packages/*'
  - 'packages/kits/*'

# Dependabot remediation (2026-07-06): pnpm overrides force patched transitive
# versions across the whole graph. All entries below are dev/build tooling
# except postcss, which is a runtime dep. pnpm overrides apply to every
# installed version matching the range key.
overrides:
  # HIGHx3 + MEDx2: vite path-traversal / fs.deny bypass class - fixed >=7.3.5.
  # Pin 7.3.7 (not 7.3.5) so the esbuild ^0.28 override stays compatible:
  # vite 7.3.5 caps esbuild at ^0.27.0, but 7.3.7 allows ^0.27.0 || ^0.28.0.
  'vite@>=7.0.0 <7.3.7': '7.3.7'
  # HIGH: rollup - fixed >=4.59.0. Scoped to the 4.x line that vite pulls in.
  'rollup@>=4.0.0 <4.59.0': '4.62.2'
  # LOW (GHSA-gv7w-rqvm-qjhr): esbuild missing binary integrity check - fixed >=0.28.1.
  esbuild: '>=0.28.1'
  # MEDIUM: picomatch 4.x ReDoS - fixed 4.0.4. Scoped to the 4.x branch
  # (the separate 2.3.2 line is already the patched v2 release).
  'picomatch@>=4.0.0 <4.0.4': '4.0.4'
  # MEDIUM (GHSA-qx2v-qp2m-jg93): postcss XSS via unescaped </style> - fixed 8.5.10. RUNTIME.
  'postcss@<8.5.23': '8.5.32'
  # CRITICAL: proxy-addr IP spoofing via IPv4-mapped addresses - fixed 2.0.8. RUNTIME (via MCP SDK / express).
  'proxy-addr@<2.0.8': '2.0.8'
  # body-parser advisory - fixed 2.4.0. RUNTIME (via MCP SDK / express).
  'body-parser@<2.4.0': '2.4.0'
  # HIGH x7: fast-uri host confusion / SSRF / authority injection - fixed >=3.1.7. RUNTIME (via MCP SDK > ajv).
  'fast-uri@<3.1.9': '3.1.9'
  # HIGH: ip-address Address4 leading-zero octet mismatch - fixed >=10.3.1. RUNTIME (via MCP SDK > express-rate-limit).
  'ip-address@<10.7.4': '10.7.5'
  # HIGH: zod memory exhaustion on oversized input - fixed >=4.6.6. RUNTIME.
  'zod@>=4.0.0 <4.6.6': '4.6.6'
  # Remaining advisories surfaced by full `pnpm audit` (patched-range floors). The hono, qs,
  # sharp, nanoid, postcss*, browserslist and source-map-js entries are dev/build or optional
  # transitive deps of the MCP SDK, Next and the dashboard toolchain.
  'hono@<4.13.11': '4.13.14'
  'qs@<6.16.0': '6.17.0'
  'sharp@<0.35.5': '0.35.5'
  'nanoid@<3.3.18': '3.3.20'
  'browserslist@<4.28.7': '4.29.5'
  'source-map-js@<1.2.2': '1.2.2'
  'postcss-selector-parser@<6.1.5': '6.1.5'
